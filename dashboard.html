<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Sanctuary</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/journey.css">
    <link rel="stylesheet" href="css/galleries.css">
    <link rel="stylesheet" href="css/wishlist.css">
</head>
<body>
    <div id="central-menu" class="active">
        <h1 class="menu-title">Our Sanctuary</h1>
        <div class="menu-grid">
            <button class="menu-card glass-panel" data-target="journey">
                <h3>Journey</h3>
            </button>
            <button class="menu-card glass-panel" data-target="galleries">
                <h3>Galleries</h3>
            </button>
            <button class="menu-card glass-panel" data-target="wishlist">
                <h3>Wishlist</h3>
            </button>
            <button class="menu-card glass-panel" data-target="letters">
                <h3>Love Letters</h3>
            </button>
        </div>
    </div>

    <button id="back-to-menu" class="glow-btn small hidden">&#8592; Menu</button>

    <main id="dashboard-container">
        <!-- JOURNEY SECTION -->
        <section id="journey" class="dash-section">
            <div class="section-header">
                <h2>Our Journey</h2>
            </div>
            <div id="journey-timeline" class="timeline-container">
                <!-- Diinjeksi oleh journey.js via vertical timeline -->
            </div>
        </section>

        <!-- GALLERIES SECTION -->
        <section id="galleries" class="dash-section">
            <div class="section-header">
                <h2>Photo Vault</h2>
                <div class="upload-wrapper">
                    <label for="photo-upload" class="glow-btn small">Upload Memory</label>
                    <input type="file" id="photo-upload" accept="image/*" hidden>
                </div>
            </div>
            <div id="gallery-grid" class="ios-grid">
                <!-- Diinjeksi oleh galleries.js -->
            </div>
        </section>

        <!-- WISHLIST SECTION -->
        <section id="wishlist" class="dash-section">
            <div class="section-header">
                <h2>Our Dreams & Milestones</h2>
            </div>
            <div class="wisher-form glass-panel">
                <input type="text" id="wish-title" placeholder="What's our next dream?">
                <input type="text" id="wish-desc" placeholder="A short description...">
                <select id="wish-category">
                    <option value="Item">Item</option>
                    <option value="Travel">Travel</option>
                    <option value="Milestone">Milestone</option>
                    <option value="Date Night">Date Night</option>
                </select>
                <div class="author-selector">
                    <label>Added by:</label>
                    <input type="radio" name="wish-author" value="Fiqri" id="wish-fiqri" checked> <label for="wish-fiqri">Fiqri</label>
                    <input type="radio" name="wish-author" value="Jasmin" id="wish-jasmin"> <label for="wish-jasmin">Jasmin</label>
                </div>
                <button id="add-wish-btn" class="glow-btn small">Add Wish</button>
            </div>
            <div id="wishlist-container" class="wish-list">
                <!-- Diinjeksi oleh wishlist.js -->
            </div>
        </section>

        <!-- LOVE LETTERS SECTION -->
        <section id="letters" class="dash-section">
            <div class="section-header">
                <h2>Digital Mailbox</h2>
            </div>
            <div class="letter-form glass-panel">
                <input type="text" id="letter-title" placeholder="Subject...">
                <textarea id="letter-body" rows="5" placeholder="Write something from the heart..."></textarea>
                <div class="author-selector">
                    <label>Written by:</label>
                    <input type="radio" name="letter-author" value="Fiqri" id="letter-fiqri" checked> <label for="letter-fiqri">Fiqri</label>
                    <input type="radio" name="letter-author" value="Jasmin" id="letter-jasmin"> <label for="letter-jasmin">Jasmin</label>
                </div>
                <button id="send-letter-btn" class="glow-btn small">Drop Letter</button>
            </div>
            <div id="letters-feed" class="letters-feed">
                <!-- Diinjeksi oleh dashboard.js -->
            </div>
        </section>
    </main>

    <!-- Modal Gambar Zoom -->
    <div id="image-modal" class="modal glass-overlay">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modal-img" alt="Zoomed memory">
        <div id="modal-caption"></div>
    </div>

    <!-- Modal Global untuk fitur EDIT (Wishlist, Gallery, Letters) -->
    <div id="edit-modal" class="modal glass-overlay">
        <div class="modal-content text-modal glass-panel">
            <h3 id="edit-modal-title" style="margin-bottom:1.5rem; font-weight: 300; font-size: 1.8rem; color: var(--neon-violet);">Edit</h3>
            <input type="text" id="edit-input-1" class="edit-input" placeholder="Title/Location">
            <textarea id="edit-input-2" class="edit-input" rows="5" placeholder="Description/Body"></textarea>
            <div style="display:flex; gap:10px; margin-top:1.5rem; justify-content:center;">
                <button id="save-edit-btn" class="glow-btn small">Save Changes</button>
                <button id="cancel-edit-btn" class="glow-btn small close-modal-btn" style="border-color:#444; color:#aaa;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Firebase Library (Wajib Pertama) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- Scripts Logika -->
    <script src="js/store.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/journey.js"></script>
    <script src="js/galleries.js"></script>
    <script src="js/wishlist.js"></script>
</body>
</html>
