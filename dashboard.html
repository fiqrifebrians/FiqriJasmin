<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiqri ♥︎ Jasmin</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/journey.css">
    <link rel="stylesheet" href="css/galleries.css">
    <link rel="stylesheet" href="css/wishlist.css">
</head>
<body>
    <div id="central-menu" class="active">
        <h1 class="menu-title" style="font-weight:400;">Fiqri <span style="color:var(--primary-purple);">♥︎</span> Jasmin</h1>
        <div class="menu-grid">
            <button class="menu-card glass-panel" data-target="journey">
                <h3>Journey</h3>
            </button>
            <button class="menu-card glass-panel" data-target="galleries">
                <h3>Galleries</h3>
            </button>
            <button class="menu-card glass-panel" data-target="wishlist">
                <h3>Wishlist</h3>
            </button>
            <button class="menu-card glass-panel" data-target="letters">
                <h3>Love Letters</h3>
            </button>
        </div>
    </div>

    <!-- Gunakan feather icon untuk back -->
    <button id="back-to-menu" class="glow-btn small hidden" style="display:flex; align-items:center; gap:5px;"><i data-feather="arrow-left" style="width:14px; height:14px;"></i> Menu</button>

    <main id="dashboard-container">
        <!-- JOURNEY -->
        <section id="journey" class="dash-section">
            <div class="section-header"><h2>Our Journey</h2></div>
            <div id="journey-timeline" class="timeline-container"></div>
        </section>

        <!-- GALLERIES -->
        <section id="galleries" class="dash-section">
            <div class="section-header">
                <h2>Photo Vault</h2>
                <div class="upload-wrapper">
                    <!-- Ditambahkan 'multiple' -->
                    <label for="photo-upload" class="glow-btn small solid">Upload Memory</label>
                    <input type="file" id="photo-upload" accept="image/*" multiple hidden>
                </div>
            </div>
            <!-- Loading indicator -->
            <div id="upload-loading" class="hidden" style="color:var(--primary-purple); text-align:center; margin-bottom:1rem; font-size:0.9rem;">Processing memories...</div>
            <div id="gallery-grid" class="ios-grid"></div>
        </section>

        <!-- WISHLIST -->
        <section id="wishlist" class="dash-section">
            <div class="section-header"><h2>Our Dreams</h2></div>
            <div class="wisher-form glass-panel">
                <input type="text" id="wish-title" placeholder="What's our next dream?">
                <input type="text" id="wish-desc" placeholder="A short description...">
                <select id="wish-category">
                    <option value="Item">Item</option>
                    <option value="Travel">Travel</option>
                    <option value="Milestone">Milestone</option>
                    <option value="Date Night">Date Night</option>
                </select>
                <div class="author-selector">
                    <label>Added by:</label>
                    <input type="radio" name="wish-author" value="Fiqri" id="wish-fiqri" checked> <label for="wish-fiqri">Fiqri</label>
                    <input type="radio" name="wish-author" value="Jasmin" id="wish-jasmin"> <label for="wish-jasmin">Jasmin</label>
                </div>
                <button id="add-wish-btn" class="glow-btn small solid">Add Wish</button>
            </div>
            <div id="wishlist-container" class="wish-list"></div>
        </section>

        <!-- LOVE LETTERS -->
        <section id="letters" class="dash-section">
            <div class="section-header"><h2>Digital Mailbox</h2></div>
            <div class="letter-form glass-panel">
                <input type="text" id="letter-title" placeholder="Subject...">
                <textarea id="letter-body" rows="5" placeholder="Write something from the heart..."></textarea>
                <div class="author-selector">
                    <label>Written by:</label>
                    <input type="radio" name="letter-author" value="Fiqri" id="letter-fiqri" checked> <label for="letter-fiqri">Fiqri</label>
                    <input type="radio" name="letter-author" value="Jasmin" id="letter-jasmin"> <label for="letter-jasmin">Jasmin</label>
                </div>
                <button id="send-letter-btn" class="glow-btn small solid">Drop Letter</button>
            </div>
            <div id="letters-feed" class="letters-feed"></div>
        </section>
    </main>

    <!-- Modals -->
    <div id="image-modal" class="modal glass-overlay">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modal-img" alt="Zoomed memory">
        <div id="modal-caption"></div>
    </div>

    <!-- Edit Universal Modal -->
    <div id="edit-modal" class="modal glass-overlay">
        <div class="modal-content text-modal glass-panel">
            <h3 id="edit-modal-title" style="margin-bottom:1.5rem; font-weight:400; font-size:1.6rem; color:var(--text-main);">Edit</h3>
            <input type="text" id="edit-input-1" class="edit-input" placeholder="Title/Location">
            <textarea id="edit-input-2" class="edit-input" rows="5" placeholder="Description/Body"></textarea>
            <div style="display:flex; gap:10px; margin-top:1.5rem; justify-content:center;">
                <button id="save-edit-btn" class="glow-btn small solid">Save</button>
                <button id="cancel-edit-btn" class="glow-btn small close-modal-btn" style="border-color:var(--glass-border); color:var(--text-muted);">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Modal Wishlist Completion Date -->
    <div id="wish-date-modal" class="modal glass-overlay">
        <div class="modal-content text-modal glass-panel">
            <h3 style="margin-bottom:1rem; font-weight:400; font-size:1.4rem;">Kapan impian ini terwujud?</h3>
            <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:1.5rem;">Catat momen indah ini di dalam Journey kita.</p>
            <input type="date" id="wish-date-input" class="edit-input" style="text-align:center; margin-bottom:1.5rem;">
            <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
                <button id="wish-today-btn" class="glow-btn small solid">Hari Ini</button>
                <button id="wish-save-date-btn" class="glow-btn small">Pilih Tanggal</button>
                <button id="wish-cancel-btn" class="glow-btn small close-modal-btn" style="border-color:var(--glass-border); color:var(--text-muted);">Batal</button>
            </div>
        </div>
    </div>

    <!-- External Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script> <!-- EXIF JS for Location & Date -->
    <script src="https://unpkg.com/feather-icons"></script> <!-- Minimalist Icons -->
    
    <script src="js/store.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/journey.js"></script>
    <script src="js/galleries.js"></script>
    <script src="js/wishlist.js"></script>
</body>
</html>
