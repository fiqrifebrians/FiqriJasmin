<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galleries - Fiqri ♥︎ Jasmin</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/galleries.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
    <a href="index.html" class="glow-btn small" style="position:fixed; top:20px; left:20px; text-decoration:none; display:flex; align-items:center; gap:5px; z-index:100;"><i data-feather="arrow-left"></i> Menu</a>
    
    <div class="page-container">
        <div class="section-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
            <h2>Galleries</h2>
            <div class="upload-wrapper" style="display:flex; gap:10px; flex-wrap:wrap;">
                <button id="toggle-map-btn" class="glow-btn small" style="display:flex; align-items:center; gap:5px;"><i data-feather="map"></i> Toggle Map</button>
                <label for="photo-upload" class="glow-btn small solid" style="cursor:pointer;">Upload Photos</label>
                <input type="file" id="photo-upload" accept="image/*" multiple hidden>
            </div>
        </div>
        
        <div id="upload-loading" class="hidden" style="color:var(--primary-purple); margin-bottom:1rem; font-size:0.9rem; text-align:center;">Extracting EXIF data & uploading...</div>
        
        <!-- Peta Minimalis (Hidden by default or shown, toggleable) -->
        <div id="map-container" class="glass-panel" style="height: 300px; padding:0; margin-bottom: 2rem; overflow:hidden; transition: all 0.3s ease;">
            <div id="map" style="width: 100%; height: 100%;"></div>
        </div>

        <div id="gallery-grid" class="ios-grid"></div>
    </div>

    <!-- Modal Gambar Zoom -->
    <div id="image-modal" class="modal glass-overlay">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modal-img" alt="Zoomed memory">
        <div id="modal-caption"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    
    <script src="js/store.js"></script>
    <script src="js/galleries.js"></script>
    <script>feather.replace();</script>
</body>
</html>
