<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Fiqri ♥︎ Jasmin</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/galleries.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
    <a href="index.html" class="glow-btn small" style="position:fixed; top:20px; left:20px; text-decoration:none; display:flex; align-items:center; gap:5px; z-index:100;"><i data-feather="arrow-left"></i> Menu</a>
    
    <div class="page-container">
        <div class="section-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
            <h2 id="gallery-page-title">Gallery</h2>
            <div class="upload-wrapper" style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                <button id="toggle-map-btn" class="action-btn" title="Toggle Map"><i data-feather="map"></i></button>
                <button id="toggle-hidden-btn" class="action-btn" title="Hidden Vault"><i data-feather="eye-off"></i></button>
                
                <label for="photo-upload" class="glow-btn small solid" style="cursor:pointer;">Upload Photos</label>
                <input type="file" id="photo-upload" accept="image/*" multiple hidden>
            </div>
        </div>
        
        <div id="upload-loading" class="hidden" style="color:var(--theme-accent); margin-bottom:1rem; font-size:0.9rem; text-align:center;">Extracting EXIF data & uploading...</div>
        
        <!-- Peta dengan Class CSS Murni untuk Responsivitas Optimal -->
        <div id="map-container" class="glass-panel">
            <div id="map" style="width: 100%; height: 100%;"></div>
        </div>

        <div id="gallery-grid" class="ios-grid"></div>
    </div>

    <!-- Zoom Image Modal -->
    <div id="image-modal" class="modal glass-overlay">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modal-img" alt="Zoomed memory">
        <div id="modal-caption"></div>
    </div>

    <!-- Password Modal -->
    <div id="password-modal" class="modal glass-overlay">
        <div class="modal-content text-modal glass-panel">
            <h3 style="margin-bottom:1rem; font-weight:400; font-size:1.6rem; color:var(--text-main);">Restricted Area</h3>
            <p style="font-size:0.95rem; color:var(--text-muted); margin-bottom:1.5rem;">Please enter the password to view hidden memories.</p>
            <input type="password" id="vault-password" class="edit-input" style="text-align:center; margin-bottom:1.5rem;" placeholder="Enter password">
            <div style="display:flex; gap:10px; justify-content:center;">
                <button id="submit-password-btn" class="glow-btn small solid">Unlock</button>
                <button id="cancel-password-btn" class="glow-btn small close-modal-btn" style="border-color:var(--glass-border); color:var(--text-muted);">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    
    <script src="js/store.js"></script>
    <script src="js/galleries.js"></script>
</body>
</html>
