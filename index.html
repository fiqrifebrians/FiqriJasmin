<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiqri ♥︎ Jasmin</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        #central-menu { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100dvh; width: 100vw; background: var(--bg-solid); transition: background 0.5s ease; }
        .menu-title { font-size: 3.5rem; font-weight: 400; color: var(--text-main); margin-bottom: 3rem; letter-spacing: 2px; }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; max-width: 700px; width: 90%; z-index: 10; }
        .menu-card { text-align: center; cursor: pointer; transition: all 0.3s ease; border: 1px solid var(--glass-border); padding: 2.5rem 1rem; text-decoration: none; display: block; border-radius: 12px; background: var(--bg-panel); backdrop-filter: blur(5px);}
        .menu-card:hover { transform: translateY(-5px); border-color: var(--theme-accent); background: var(--bg-panel-hover); box-shadow: 0 5px 15px var(--theme-accent-trans); }
        .menu-card h3 { font-size: 1.6rem; font-weight: 400; color: var(--text-main); }
        
        /* CSS Opsi Tema */
        .theme-selector { position: fixed; top: 20px; right: 20px; display: flex; gap: 12px; z-index: 1000; background: rgba(0, 0, 0, 0.2); padding: 8px 12px; border-radius: 30px; border: 1px solid var(--glass-border); backdrop-filter: blur(10px); }
        .theme-icon { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; transition: transform 0.3s, border-color 0.3s; object-fit: cover; border: 2px solid transparent; }
        .theme-icon:hover { transform: scale(1.15); border-color: var(--theme-accent); }
        body.theme-cony .theme-selector { background: rgba(255, 255, 255, 0.5); }
        
        @media (max-width: 768px) { .menu-grid { grid-template-columns: 1fr; } .menu-title { font-size: 2.5rem; } .theme-selector { top: 15px; right: 15px; } .theme-icon { width: 30px; height: 30px; } }
    </style>
</head>
<body>
    <!-- Opsi Pemilih Tema -->
    <div class="theme-selector">
        <img src="assets/cony-icon.png" class="theme-icon" onclick="setTheme('cony')" title="Cony Theme">
        <img src="assets/brown-icon.png" class="theme-icon" onclick="setTheme('brown')" title="Brown Theme">
        <img src="assets/twilight-icon.png" class="theme-icon" onclick="setTheme('twilight')" title="Twilight Sparkle Theme">
    </div>

    <div id="central-menu">
        <h1 class="menu-title">Fiqri <span style="color:var(--theme-accent);">♥︎</span> Jasmin</h1>
        <div class="menu-grid">
            <a href="journey.html" class="menu-card"><h3>Journey</h3></a>
            <a href="galleries.html" class="menu-card"><h3>Gallery</h3></a>
            <a href="wishlist.html" class="menu-card"><h3>Wishlist</h3></a>
            <a href="letters.html" class="menu-card"><h3>Love Letters</h3></a>
        </div>
    </div>
    
    <!-- Pustaka Database Tetap Dimuat Agar store.js Berjalan Sempurna -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="js/store.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const links = document.querySelectorAll('.menu-card');
            links.forEach(link => {
                link.addEventListener('click', (e) => {
                    const target = link.getAttribute('href');
                    if (target) {
                        e.preventDefault();
                        document.body.classList.add('page-exit');
                        setTimeout(() => { window.location.href = target; }, 750); 
                    }
                });
            });
        });
    </script>
</body>
</html>
