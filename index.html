<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiqri ♥︎ Jasmin</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        #central-menu { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100dvh; width: 100vw; background: var(--bg-solid); }
        .menu-title { font-size: 3.5rem; font-weight: 400; color: var(--text-main); margin-bottom: 3rem; letter-spacing: 2px; }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; max-width: 700px; width: 90%; }
        .menu-card { text-align: center; cursor: pointer; transition: all 0.3s ease; border: 1px solid var(--glass-border); padding: 2.5rem 1rem; text-decoration: none; display: block; border-radius: 12px; background: var(--bg-panel);}
        .menu-card:hover { transform: translateY(-5px); border-color: var(--primary-purple); background: #110818; }
        .menu-card h3 { font-size: 1.6rem; font-weight: 400; color: var(--text-main); }
        @media (max-width: 768px) { .menu-grid { grid-template-columns: 1fr; } .menu-title { font-size: 2.5rem; } }
    </style>
</head>
<body>
    <div id="central-menu">
        <h1 class="menu-title">Fiqri <span style="color:var(--primary-purple);">♥︎</span> Jasmin</h1>
        <div class="menu-grid">
            <a href="journey.html" class="menu-card"><h3>Journey</h3></a>
            <a href="galleries.html" class="menu-card"><h3>Gallery</h3></a>
            <a href="wishlist.html" class="menu-card"><h3>Our Wishlist</h3></a>
            <a href="letters.html" class="menu-card"><h3>Love Letters</h3></a>
        </div>
    </div>
</body>
</html>
