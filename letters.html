<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Letters - Fiqri ♥︎ Jasmin</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/letters.css">
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
    <a href="index.html" class="glow-btn small" style="position:fixed; top:20px; left:20px; text-decoration:none; display:flex; align-items:center; gap:5px; z-index:100;"><i data-feather="arrow-left"></i> Menu</a>
    
    <div class="page-container">
        <div class="section-header"><h2>Digital Mailbox</h2></div>
        
        <div class="letter-form glass-panel">
            <input type="text" id="letter-title" placeholder="Subject...">
            <textarea id="letter-body" rows="5" placeholder="Write something from the heart..."></textarea>
            <div class="author-selector">
                <label>Written by:</label>
                <input type="radio" name="letter-author" value="Fiqri" id="letter-fiqri" checked> <label for="letter-fiqri">Fiqri</label>
                <input type="radio" name="letter-author" value="Jasmin" id="letter-jasmin"> <label for="letter-jasmin">Jasmin</label>
            </div>
            <button id="send-letter-btn" class="glow-btn small solid">Drop Letter</button>
        </div>
        
        <div id="letters-feed" class="letters-feed"></div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal glass-overlay">
        <div class="modal-content text-modal glass-panel">
            <h3 id="edit-modal-title" style="margin-bottom:1.5rem; font-weight:400; font-size:1.6rem; color:var(--text-main);">Edit Letter</h3>
            <input type="text" id="edit-input-1" class="edit-input" placeholder="Subject">
            <textarea id="edit-input-2" class="edit-input" rows="5" placeholder="Body"></textarea>
            <div style="display:flex; gap:10px; margin-top:1.5rem; justify-content:center;">
                <button id="save-edit-btn" class="glow-btn small solid">Save</button>
                <button id="cancel-edit-btn" class="glow-btn small close-modal-btn" style="border-color:var(--glass-border); color:var(--text-muted);">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="js/store.js"></script>
    <script src="js/letters.js"></script>
    <script>feather.replace();</script>
</body>
</html>
