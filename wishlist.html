<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Wishlist - Fiqri & Jasmin</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/wishlist.css">
</head>
<body>
    <div class="theme-selector">
        <img src="assets/cony-icon.png" class="theme-icon" onclick="setTheme('cony')" title="Cony Theme">
        <img src="assets/brown-icon.png" class="theme-icon" onclick="setTheme('brown')" title="Brown Theme">
        <img src="assets/twilight-icon.png" class="theme-icon" onclick="setTheme('twilight')" title="Twilight Sparkle Theme">
    </div>

    <div class="container">
        <header class="wishlist-header">
            <a href="index.html" class="back-btn">&#10229; Home</a>
            <h1>Wishlist</h1>
            <p>Our dreams, goals, and little things we want to do together.</p>
        </header>

        <!-- Bar Kontrol Filter dan Sort yang Estetik -->
        <div class="controls-bar glass-panel">
            <div class="filter-group">
                <label for="category-filter">Category:</label>
                <select id="category-filter" class="filter-select">
                    <option value="all">All Items</option>
                    <option value="date">Date Idea</option>
                    <option value="gift">Gift / Item</option>
                    <option value="travel">Travel</option>
                    <option value="other">Other</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="sort-select">Sort by:</label>
                <select id="sort-select" class="filter-select">
                    <option value="latest">Latest Added</option>
                    <option value="oldest">Oldest Added</option>
                </select>
            </div>

            <button class="glow-btn small" id="open-add-modal">+ Add Wish</button>
        </div>

        <div class="wishlist-grid" id="wishlist-grid">
            <!-- Render via JS -->
        </div>
    </div>

    <!-- Modal Add / Edit -->
    <div class="modal glass-overlay" id="wishlist-modal">
        <div class="text-modal glass-panel">
            <span class="close-modal" id="close-modal">&times;</span>
            <h2 id="modal-title" style="margin-bottom: 20px; font-weight: 400;">Add New Wish</h2>
            <form id="wish-form">
                <input type="hidden" id="edit-wish-id">
                <div style="margin-bottom: 15px; text-align: left;">
                    <label style="font-size: 0.9rem; color: var(--text-muted);">Title:</label>
                    <input type="text" id="wish-title" required class="edit-input" style="width:100%; padding: 10px; margin-top:5px; border-radius:6px; border:1px solid var(--glass-border); background:var(--bg-panel); color:var(--text-main);">
                </div>
                <div style="margin-bottom: 15px; text-align: left;">
                    <label style="font-size: 0.9rem; color: var(--text-muted);">Category:</label>
                    <select id="wish-category" class="edit-input" style="width:100%; padding: 10px; margin-top:5px; border-radius:6px; border:1px solid var(--glass-border); background:var(--bg-panel); color:var(--text-main);">
                        <option value="date">Date Idea</option>
                        <option value="gift">Gift / Item</option>
                        <option value="travel">Travel</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div style="margin-bottom: 20px; text-align: left;">
                    <label style="font-size: 0.9rem; color: var(--text-muted);">Description / Notes:</label>
                    <textarea id="wish-desc" rows="3" class="edit-input" style="width:100%; padding: 10px; margin-top:5px; border-radius:6px; border:1px solid var(--glass-border); background:var(--bg-panel); color:var(--text-main); resize:none;"></textarea>
                </div>
                <div style="margin-bottom: 20px; text-align: left;" id="author-container">
                    <label style="font-size: 0.9rem; color: var(--text-muted);">Added by:</label>
                    <select id="wish-author" class="edit-input" style="width:100%; padding: 10px; margin-top:5px; border-radius:6px; border:1px solid var(--glass-border); background:var(--bg-panel); color:var(--text-main);">
                        <option value="Fiqri">Fiqri</option>
                        <option value="Jasmin">Jasmin</option>
                    </select>
                </div>
                <button type="submit" class="glow-btn solid" style="width: 100%;">Save Wish</button>
            </form>
        </div>
    </div>

    <!-- Modal Complete Wish -->
    <div class="modal glass-overlay" id="complete-modal">
        <div class="text-modal glass-panel">
            <span class="close-modal" id="close-complete-modal">&times;</span>
            <h2 style="margin-bottom: 15px; font-weight: 400;">Mark as Completed ✨</h2>
            <p style="margin-bottom: 20px; color: var(--text-muted); font-size: 0.95rem;">When did you make this dream come true?</p>
            <form id="complete-form">
                <input type="hidden" id="complete-wish-id">
                <div style="margin-bottom: 20px;">
                    <input type="date" id="completion-date" required class="edit-input" style="width:100%; padding: 10px; border-radius:6px; border:1px solid var(--glass-border); background:var(--bg-panel); color:var(--text-main);">
                </div>
                <button type="submit" class="glow-btn solid" style="width: 100%;">Confirm & Add to Journey</button>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="js/store.js"></script>
    <script src="js/wishlist.js"></script>
</body>
</html>
