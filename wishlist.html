<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - Fiqri ♥︎ Jasmin</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/wishlist.css">
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
    <a href="index.html" class="glow-btn small" style="position:fixed; top:20px; left:20px; text-decoration:none; display:flex; align-items:center; gap:5px; z-index:100;"><i data-feather="arrow-left"></i> Menu</a>
    
    <div class="page-container">
        <div class="section-header"><h2>Our Dreams</h2></div>
        
        <div class="wisher-form glass-panel">
            <input type="text" id="wish-title" placeholder="What's our next dream?">
            <input type="text" id="wish-desc" placeholder="A short description...">
            <select id="wish-category">
                <option value="Item">Item</option>
                <option value="Travel">Travel</option>
                <option value="Milestone">Milestone</option>
                <option value="Date Night">Date</option>
            </select>
            <div class="author-selector">
                <label>Added by:</label>
                <input type="radio" name="wish-author" value="Fiqri" id="wish-fiqri" checked> <label for="wish-fiqri">Fiqri</label>
                <input type="radio" name="wish-author" value="Jasmin" id="wish-jasmin"> <label for="wish-jasmin">Jasmin</label>
            </div>
            <button id="add-wish-btn" class="glow-btn small solid">Add Wish</button>
        </div>
        
        <div id="wishlist-container" class="wish-list"></div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal glass-overlay">
        <div class="modal-content text-modal glass-panel">
            <h3 id="edit-modal-title" style="margin-bottom:1.5rem; font-weight:400; font-size:1.6rem; color:var(--text-main);">Edit</h3>
            <input type="text" id="edit-input-1" class="edit-input" placeholder="Title">
            <textarea id="edit-input-2" class="edit-input" rows="5" placeholder="Description"></textarea>
            <div style="display:flex; gap:10px; margin-top:1.5rem; justify-content:center;">
                <button id="save-edit-btn" class="glow-btn small solid">Save</button>
                <button id="cancel-edit-btn" class="glow-btn small close-modal-btn" style="border-color:var(--glass-border); color:var(--text-muted);">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Date Modal -->
    <div id="wish-date-modal" class="modal glass-overlay">
        <div class="modal-content text-modal glass-panel">
            <h3 style="margin-bottom:1rem; font-weight:400; font-size:1.4rem;">When was this achieved?</h3>
            <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:1.5rem;">Record this beautiful moment in our Journey.</p>
            <input type="date" id="wish-date-input" class="edit-input" style="text-align:center; margin-bottom:1.5rem;">
            <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
                <button id="wish-today-btn" class="glow-btn small solid">Today</button>
                <button id="wish-save-date-btn" class="glow-btn small">Choose Date</button>
                <button id="wish-cancel-btn" class="glow-btn small close-modal-btn" style="border-color:var(--glass-border); color:var(--text-muted);">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="js/store.js"></script>
    <script src="js/wishlist.js"></script>
    <script>feather.replace();</script>
</body>
</html>
